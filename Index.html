<head>
    <meta charset="UTF-8">
    <title>PS2 Game Cover Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .search-bar {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-bar input {
            width: 90%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .game-card {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .game-card img {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .title {
            font-weight: bold;
            font-size: 15px;
        }
        .gameid {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

        const grid = document.getElementById("gameGrid");
        games.forEach(game => {
            const div = document.createElement("div");
            div.className = "game-card";
            div.innerHTML = `
                <img src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/140x200?text=No+Cover'">
                <div class="title">${game.title}</div>
                <div class="gameid">${game.gameid}</div>
            `;
            grid.appendChild(div);
        });

        function filterGames() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const cards = document.getElementsByClassName("game-card");
            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getElementsByClassName("title")[0].textContent.toLowerCase();
                const id = cards[i].getElementsByClassName("gameid")[0].textContent.toLowerCase();
                cards[i].style.display = (title.includes(input) || id.includes(input)) ? "" : "none";
            }
        }
